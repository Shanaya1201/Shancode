name: Shancode CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Root Dependencies
      run: npm install

    - name: Test & Verify Backend
      run: |
        cd backend
        npm install
        npm run seed
        node -e "import('./src/config/db.js').then(m => m.getDb()).then(() => console.log('DB Verified'))"

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build
